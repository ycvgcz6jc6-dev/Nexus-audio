name: "Nexus Audio"
version: "1.0.0-rc4"
slug: "ha_audio_input_gateway"
description: "Nexus Audio by Mct. — AirPlay, Spotify Connect, Dante RX and AES67 to Music Assistant"
arch: [amd64, aarch64]
init: false
host_network: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:audio-waveform"
panel_title: "Nexus Audio"
audio: true
hassio_api: true
homeassistant_api: true
map:
  - addon_config:rw
  - share:rw
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Gateway management API"
options:
  music_assistant:
    host: "127.0.0.1"
    port: 8927
  dante:
    clock_path: "/share/usrvclock"
    require_clock: true
    log_level: "info"
  sources: []
schema:
  music_assistant:
    host: str
    port: int(1,65535)
  dante:
    clock_path: str
    require_clock: bool
    log_level: str
  sources:
    - id: str
      type: list(airplay|spotify|dante_rx|cast)
      name: str
      interface: str
      enabled: bool
      channels: int(1,64)?
      sample_rate: int(8000,192000)?
      dante_mode: list(native_dante|aes67)?
      process_id: int(0,65535)?
      alt_port: port?
      rx_latency_ms: float?
      airplay_password: password?
      dante_channels: str?
      multicast_ip: str?
      rtp_port: port?
      payload_type: int(0,127)?
      aes67_codec: list(L16|L24)?
      auto_restart: bool?
      spotify_bitrate: list(96|160|320)?
      spotify_device_type: list(speaker|avr|computer)?
      spotify_normalisation: bool?
      spotify_autoplay: bool?
url: "https://github.com/ycvgcz6jc6-dev/Nexus-audio"
